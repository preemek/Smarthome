<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Device</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #1c0c27;
            color: #e4d7f5;
            font-family: 'Comic Sans MS', Tahoma, Geneva, Verdana, sans-serif;
        }

        .container {
            max-width: 500px;
            background-color: #291a40;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
            margin-top: 50px;
        }

        h1 {
            color: #cdaaf7;
            text-align: center;
            margin-bottom: 20px;
        }

        .form-label {
            font-weight: bold;
            color: #d1b3ff;
        }

        .form-control {
            background-color: #3a235e;
            color: #e4d7f5;
            border: none;
            padding: 10px;
        }

        .form-control::placeholder {
            color: #a588d9;
        }

        .form-control:focus {
            background-color: #4b2b6e;
            box-shadow: none;
            color: #fff;
        }

        .btn-primary {
            background-color: #8b5cf6;
            border: none;
            width: 100%;
            padding: 10px;
            font-size: 18px;
            font-weight: bold;
        }

        .btn-primary:hover {
            background-color: #7c3aed;
        }

        .btn-secondary {
            background-color: #6c757d;
            border: none;
            width: 100%;
            padding: 10px;
            font-size: 16px;
        }

        .btn-secondary:hover {
            background-color: #5a6268;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>➕ Add Device</h1>
        <form method="post" action="{% url 'add_device' %}">  
            {% csrf_token %}
            <div class="mb-3">
                <label for="id_name" class="form-label">📟 Name</label>
                <input type="text" name="name" id="id_name" class="form-control" placeholder="Enter device name" required>
            </div>
            <div class="mb-3">
                <label for="id_functions" class="form-label">⚙️ Functions</label>
                <input type="text" name="functions" id="id_functions" class="form-control" placeholder="Enter device function" required>
            </div>
            <button type="submit" class="btn btn-primary">🚀 Add Device</button>
        </form>
        <hr>
        <a href="{% url 'devices_list' %}" class="btn btn-secondary">⬅️ Back to Devices</a>
    </div>

</body>
</html>
